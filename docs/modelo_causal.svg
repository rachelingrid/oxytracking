<line x1="40" y1="950" x2="1520" y2="950" stroke="#e8e8e8" stroke-width="1"/>
<text x="40" y="972" font-size="11.8" fill="#5b6b73" font-family="Helvetica,Arial,sans-serif">Modelo de hipótese, não de causalidade demonstrada. O componente obstrutivo e o central derivam do mesmo evento vascular de tronco, o que dispensa duas etiologias independentes. No registro</text>
<text x="40" y="988" font-size="11.8" fill="#5b6b73" font-family="Helvetica,Arial,sans-serif">analisado o comprimento do ciclo (68 s) favorece atraso circulatório prolongado — secundário à bradicardia — sobre ganho elevado do controlador; lesão quimiorreceptora reduziria o ganho e</text>
<text x="40" y="1004" font-size="11.8" fill="#5b6b73" font-family="Helvetica,Arial,sans-serif">tenderia a estabilizar, não a oscilar. Confirmação exige polissonografia tipo I com esforço torácico-abdominal, EEG e posição corporal.</text>
</svg>